name: Ping Supabase

on:
  schedule:
    - cron: "0 2 */5 * *"   # tiap 5 hari, jam 02:00 UTC (09:00 WIB)
  workflow_dispatch:         # bisa juga dijalankan manual dari tab Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query tabel guests
        run: |
          curl -fsS "https://gvkkjsezlbemrttklcsz.supabase.co/rest/v1/guests?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
